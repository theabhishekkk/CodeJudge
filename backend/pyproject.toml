[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codejudge"
version = "0.1.0"
description = "Distributed online judge for LLM-generated code"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.34",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "bcrypt>=4.1.2",
  "pyjwt>=2.8.0",
  "celery>=5.4.0",
  "pika>=1.3.2",
  "redis>=5.0.0",
  "docker>=7.1.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.4",
]

[tool.setuptools]
packages = [
  "codejudge",
  "codejudge.api",
  "codejudge.api.routers",
  "codejudge.core",
  "codejudge.worker",
  "codejudge.worker.runner",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
